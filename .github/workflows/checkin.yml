name: NewAPI 自动签到

on:
  # 定时执行：每天 UTC 16:08 (北京时间 0:08)
  # (touch: force re-parse workflow by GitHub Actions)
  schedule:
    - cron: '8 16 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 安装 Camoufox + Xvfb（Turnstile 求解用，有头需 Xvfb）
        run: |
          pip install "camoufox[geoip]"
          python -m camoufox fetch
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: 执行签到
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          QD_USERNAME: ${{ secrets.QD_USERNAME }}
          QD_PASSWORD: ${{ secrets.QD_PASSWORD }}
          QD_CODE: ${{ secrets.QD_CODE }}
          QD_URL: ${{ secrets.QD_URL }}
          QD_USER_ID: ${{ secrets.QD_USER_ID }}
          CHECKIN_HEADLESS: 'false'
        run: |
          # 调试探活：确认 runner 能否连通 QD 站（TCP/TLS/HTTP 三层）
          QD_HOST=$(python -c "import urllib.parse;print(urllib.parse.urlparse('${{ secrets.QD_URL }}').netloc)")
          echo "QD_HOST=$QD_HOST"
          echo "--- TCP 443 ---"; timeout 12 bash -c "exec 3<>/dev/tcp/$QD_HOST/443" && echo "TCP OK" || echo "TCP FAIL"
          echo "--- HTTPS HEAD ---"; curl -ksS --connect-timeout 12 --max-time 20 -I "https://$QD_HOST/" 2>&1 | head -8 || echo "curl FAIL"
          echo "--- python 登录超时测试 ---"
          xvfb-run -a python checkin.py
